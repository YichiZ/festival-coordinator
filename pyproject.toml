[project]
name = "festival-coordinator"
version = "0.1.0"
description = "Voice-based AI assistant for festival trip planning"
requires-python = "==3.13.*"
dependencies = [
    "pipecat-ai[anthropic,cartesia,daily,local-smart-turn-v3,runner,silero,tracing,webrtc]",
    "pipecat-ai-cli",
    "supabase",
    "pipecatcloud>=0.2.19",
    "opentelemetry-exporter-otlp-proto-http",
    "fastapi[standard]",
    "aiohttp",
    "python-dotenv",
]

[dependency-groups]
dev = [
    "pyright>=1.1.404,<2",
    "ruff>=0.12.11,<1",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
[tool.ruff.lint]
select = ["I"]